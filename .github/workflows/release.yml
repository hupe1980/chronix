name: Release

# Tag-driven. `git push origin v0.3.0` publishes the eight library crates to
# crates.io, builds the `chronixd` binaries and attaches them to the GitHub
# release.
#
# Publishing is irreversible per version, so it runs last: the tag is checked
# against the manifest, the release gate runs, and every binary target builds
# before a single crate is uploaded. `workflow_dispatch` exercises the whole
# path with `--dry-run` publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true
      dry_run:
        description: "Publish with --dry-run"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag says one version; the manifest says another. Catch that before
  # producing artefacts named after the wrong one.
  verify:
    name: Verify the tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "v$manifest" ] || {
            echo "::error::tag $tag does not match workspace version $manifest" >&2
            exit 1
          }
          # The Python SDK carries its own version and is published from this
          # same tag. `skip-existing` on the PyPI upload turns a stale version
          # into a *silent success* — the release completes having published
          # nothing — so the mismatch has to fail here instead.
          #
          # The version is dynamic (`[tool.hatch.version]` reads it out of
          # this same Cargo.toml), so there is no static `version = "…"` left
          # to `sed` for — resolve it the same way hatchling does: `tomllib`
          # for the `path`/`pattern` it declares, then that regex against the
          # file it points at.
          sdk=$(python3 - <<'PY'
          import pathlib
          import re
          import tomllib

          proj = tomllib.loads(pathlib.Path("sdks/python/pyproject.toml").read_text())
          if "version" not in proj.get("project", {}).get("dynamic", []):
              raise SystemExit("sdks/python/pyproject.toml must declare a dynamic version")
          hatch_version = proj.get("tool", {}).get("hatch", {}).get("version", {})
          path, pattern = hatch_version.get("path"), hatch_version.get("pattern")
          if not path or not pattern:
              raise SystemExit("[tool.hatch.version] must set path and pattern")
          text = (pathlib.Path("sdks/python") / path).resolve().read_text()
          match = re.search(pattern, text, re.MULTILINE)
          if not match:
              raise SystemExit(f"version pattern did not match {path}")
          print(match.group("version"))
          PY
          )
          echo "python sdk=$sdk"
          [ "$sdk" = "$manifest" ] || {
            echo "::error::sdks/python/pyproject.toml resolves to $sdk, workspace is $manifest" >&2
            exit 1
          }
          # `[workspace.dependencies]` repeats the version for each internal
          # crate, because `cargo publish` refuses a dependency that carries
          # only a `path`. A bump that misses them fails at the *publish*
          # step — after the tag is pushed and CI has passed, which is the one
          # point this workflow cannot take back.
          bad=$(grep -oE 'path = "crates/chronix[a-z-]*", version = "[^"]+"' Cargo.toml \
                | grep -v "version = \"$manifest\"" || true)
          [ -z "$bad" ] || {
            echo "::error::internal dependency versions disagree with $manifest:" >&2
            echo "$bad" >&2
            exit 1
          }

      # A binary for a target no CI job builds is a promise nobody checks —
      # the matrix shipped two such targets before anyone noticed. Cheap
      # enough to assert here rather than to remember.
      - name: Every shipped target is exercised by CI
        run: |
          python3 - <<'EOF'
          import sys, yaml
          ci = yaml.safe_load(open(".github/workflows/ci.yml"))
          rel = yaml.safe_load(open(".github/workflows/release.yml"))
          native = {
              "ubuntu-latest": "x86_64-unknown-linux-gnu",
              "ubuntu-24.04": "x86_64-unknown-linux-gnu",
              "ubuntu-24.04-arm": "aarch64-unknown-linux-gnu",
              "macos-latest": "aarch64-apple-darwin",
          }
          covered = set()
          for job in ci["jobs"].values():
              m = job.get("strategy", {}).get("matrix", {})
              covered.update(m.get("target", []))
              runs = m.get("os") or ([job["runs-on"]] if isinstance(job.get("runs-on"), str) else [])
              covered.update(native.get(label, label) for label in runs)
          shipped = [e["target"] for e in rel["jobs"]["binaries"]["strategy"]["matrix"]["include"]]
          missing = [t for t in shipped if t not in covered]
          for t in missing:
              print(f"::error::{t} is shipped but no CI job builds it")
          print(f"shipped: {len(shipped)}, uncovered: {len(missing)}")
          sys.exit(1 if missing else 0)
          EOF

  # A tag push does not run the CI workflow, so the gate runs here too. These
  # are the checks a published version cannot be taken back from.
  # CI already ran every check on this commit, and runs *more* of them than a
  # release-time re-run would: the aarch64 targets, the feature matrix, miri,
  # the MSRV floor, `cargo deny` and the site build are all CI jobs. Repeating
  # a subset here would take half an hour to prove less. So this waits for
  # CI's verdict on this exact SHA instead of re-deriving it.
  #
  # A tag on a commit CI never saw has no verdict, and fails here rather than
  # publishing on trust.
  ci-passed:
    name: CI passed for this commit
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for CI to conclude, then require success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          deadline=$(( SECONDS + 45 * 60 ))
          echo "waiting for CI on $sha"
          while :; do
            runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100" \
              --jq '.workflow_runs')
            success=$(printf '%s' "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
            failed=$(printf '%s' "$runs" | jq '[.[] | select(.conclusion != null and .conclusion != "success")] | length')
            total=$(printf '%s' "$runs" | jq 'length')

            if [ "$success" -gt 0 ]; then
              echo "CI passed for $sha"
              exit 0
            fi
            if [ "$failed" -gt 0 ]; then
              echo "::error::CI concluded unsuccessfully for $sha — fix it and re-tag" >&2
              exit 1
            fi
            if [ "$total" -eq 0 ] && [ "$SECONDS" -gt 300 ]; then
              echo "::error::no CI run exists for $sha. Push the commit to main and let CI run before tagging." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on $sha" >&2
              exit 1
            fi
            sleep 30
          done

  binaries:
    name: chronixd (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target builds on a runner of its own architecture, so the C
          # that `aws-lc-rs` compiles is native and no cross toolchain is
          # involved. Only musl adds anything, and only a libc.
          #
          # Each of these four is exercised by CI: x86_64 gnu and arm64 macOS
          # by the `test` job's matrix, both aarch64 Linux targets by the
          # `aarch64` job. `x86_64-unknown-linux-musl` and
          # `x86_64-apple-darwin` were dropped because nothing tested them —
          # a shipped binary for a target no job builds is a promise nobody
          # checks. Alpine on x86_64 and Intel Macs build from source; adding
          # either back means adding it to CI in the same commit.
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          # ARM servers (Graviton, Ampere) and, with musl, the design
          # partner's gateway: a static binary with no libc version to match.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,     target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-protoc
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked -p chronixd --target ${{ matrix.target }}

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="chronixd-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/chronixd" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  # Last, because it cannot be undone. `chronixd` is not here: its `cluster`
  # feature depends on `publish = false` crates, and cargo requires
  # a version for every packaged dependency, optional ones included.
  crates-io:
    name: Publish to crates.io
    # Only the gate. `chronixd` is `publish = false`, so nothing this job
    # uploads comes out of the `binaries` matrix — waiting for four release
    # builds bought no safety for the crates and put them on the critical
    # path. The gate is what must pass before an irreversible publish.
    needs: [ci-passed]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      # The order below is the contract: cargo resolves each crate's
      # dependencies against crates.io, not against this tree, so a crate
      # cannot go up before the ones it depends on. One step per crate rather
      # than a loop, so the release page shows exactly how far it got.
      - name: Publish order matches the manifests
        run: |
          set -euo pipefail
          derived=$(./scripts/publish-order.sh)
          declared=$(grep -oE 'publish-crate\.sh [a-z-]+' .github/workflows/release.yml \
                     | awk '{print $2}')
          if [ "$derived" != "$declared" ]; then
            echo "::error::the publish steps are stale. Derived order:" >&2
            printf '%s\n' "$derived" >&2
            echo "declared in this file:" >&2
            printf '%s\n' "$declared" >&2
            exit 1
          fi
          echo "publish order is current"

      - name: Publish chronix-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-core

      - name: Publish chronix-analytics
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-analytics

      - name: Publish chronix-encoding
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-encoding

      - name: Publish chronix-security
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-security

      - name: Publish chronix-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-engine

      - name: Publish chronix-query
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-query

      - name: Publish chronix-streaming
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix-streaming

      - name: Publish chronix
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: ./scripts/publish-crate.sh chronix

  # ── Publish the Python SDK to PyPI ───────────────────────────────────
  pypi:
    name: Publish chronix-client to PyPI
    # The same gate as the crates: CI's verdict on this exact commit. The SDK
    # is pure Python, so there is no wheel matrix — one sdist and one
    # universal wheel cover every platform.
    needs: [ci-passed]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI Trusted Publishing mints a short-lived OIDC token in place of a
      # long-lived API token. Nothing else in this job needs write access.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        working-directory: sdks/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          # A re-run after a partial release must not fail on a version that
          # is already up. The version itself is checked in `verify`, so this
          # cannot quietly skip a stale build.
          skip-existing: true

  github-release:
    name: Attach binaries to the release
    needs: [binaries, crates-io]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Set up protoc
description: Install the protobuf compiler for the chronixd build.

runs:
  using: composite
  steps:
    - name: Install protoc
      shell: bash
      run: |
        set -euo pipefail
        if command -v protoc >/dev/null; then
          protoc --version
          exit 0
        fi
        case "$RUNNER_OS" in
          Linux)
            # Both packages and metadata come from Ubuntu's own archive.
            apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources
                         -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
            sudo apt-get "${apt_sources[@]}" update -qq
            sudo apt-get "${apt_sources[@]}" install -y protobuf-compiler
            ;;
          macOS)   brew install protobuf ;;
          Windows) choco install protoc --no-progress ;;
          *)       echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
        esac
        protoc --version

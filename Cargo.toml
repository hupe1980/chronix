[workspace]
resolver = "2"
members = [
    # ── Default build: the embedded database + server ──────────────
    "crates/chronix-core",
    "crates/chronix-encoding",
    "crates/chronix-engine",
    "crates/chronix-security",
    "crates/chronix-streaming",
    "crates/chronix-analytics",
    "crates/chronix-query",
    "crates/chronix",
    "crates/chronixd",
    # ── Dev-only tooling ───────────────────────────────────────────
    "crates/chronix-chaos",
    # ── Frozen: distributed cluster (build with `-p` or `--workspace`;
    #    thaw is a post-v1.0 decision — see concepts/CLUSTER.md) ──────────
    "crates/chronix-meta",
    "crates/chronix-cluster",
    "crates/chronix-dsim",
]

# The frozen cluster tier and dev tooling are excluded from the default
# build/test set. `cargo build` / `cargo test` covers the product;
# `cargo test --workspace` additionally covers the frozen crates.
default-members = [
    "crates/chronix-core",
    "crates/chronix-encoding",
    "crates/chronix-engine",
    "crates/chronix-security",
    "crates/chronix-streaming",
    "crates/chronix-analytics",
    "crates/chronix-query",
    "crates/chronix",
    "crates/chronixd",
    "crates/chronix-chaos",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["hupe1980"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/chronix"
homepage = "https://github.com/hupe1980/chronix"
documentation = "https://docs.rs/chronix"
readme = "README.md"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates.
#
# The `version` is not decoration: `cargo publish` refuses a manifest whose
# dependency carries only a `path`, so without it none of the seven crates that
# depend on a sibling can be released at all. Declared once here, inherited by
# every member through `chronix-core.workspace = true`.
chronix = { path = "crates/chronix", version = "0.1.0" }
chronix-core = { path = "crates/chronix-core", version = "0.1.0" }
chronix-engine = { path = "crates/chronix-engine", version = "0.1.0" }
chronix-security = { path = "crates/chronix-security", version = "0.1.0" }
chronix-streaming = { path = "crates/chronix-streaming", version = "0.1.0" }
chronix-encoding = { path = "crates/chronix-encoding", version = "0.1.0" }
chronix-query = { path = "crates/chronix-query", version = "0.1.0" }
chronix-analytics = { path = "crates/chronix-analytics", version = "0.1.0" }
# Frozen and dev-only: never published, so a path-only dependency is correct.
chronix-meta = { path = "crates/chronix-meta" }
chronix-cluster = { path = "crates/chronix-cluster" }
chronix-chaos = { path = "crates/chronix-chaos" }
chronix-dsim = { path = "crates/chronix-dsim" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Binary serialization for the WAL, segment metadata, the catalog manifest and
# model snapshots.
#
# postcard rather than bincode: bincode's development ceased permanently after
# a doxxing and harassment incident, and 3.0.0 was published as a tombstone —
# a README and a `lib.rs` that is a deliberate compile error, because
# crates.io cannot mark a crate archived (RUSTSEC-2025-0141). bincode 2 is the
# same dead line. Of the successors the advisory names, postcard is the only
# one that keeps serde, which every persisted type here derives; it is also
# varint-encoded, so the WAL and segment metadata get smaller on the flash
# storage the embedded target writes to (D50).
#
# `default-features = false`: postcard's default `heapless-cas` pulls in
# heapless 0.7, which on some targets depends on the unmaintained
# `atomic-polyfill` (RUSTSEC-2023-0089). Nothing here serialises into a
# fixed-capacity buffer, so the feature is cost without benefit.
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"

# Hashing & checksums
crc32c = "0.6"
fnv = "1"

# Raft consensus
openraft = { version = "0.9", features = ["serde", "storage-v2"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
async-stream = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
# `default-features = false`: chronixd installs a recorder and renders
# `/metrics` through its own axum route, so the crate's HTTP listener and
# push-gateway clients are unused — and they are what drag `hyper-rustls`,
# and with it a second rustls crypto provider and a C build of aws-lc-sys.
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# HTTP
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
utoipa = { version = "5", features = ["axum_extras"] }

# gRPC
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"

# TLS
#
# `default-features = false` matters: rustls's defaults enable `aws-lc-rs`, and
# with two providers compiled in and none installed `ServerConfig::builder()`
# cannot choose and **panics** (D41). It also drags `aws-lc-sys`, which builds C
# through cmake — the toolchain the aarch64 cross-compile does not have (R11).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# PEM parsing comes from rustls-pki-types: rustls-pemfile is unmaintained
# (RUSTSEC-2025-0134) and is now only a thin wrapper over this.
rustls-pki-types = "1.12"
# `default-features = false`: tokio-rustls's defaults enable `aws_lc_rs` too.
# Four separate crates pulled a second provider in this way, and it takes all
# four to remove it — any one of them left alone reinstates the panic (D41).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# `tls-rustls-no-provider` rather than `tls-rustls`: the latter forces
# `rustls/aws-lc-rs` on, which is the other half of the two-provider panic.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# Arrow Flight
arrow-flight = { version = "59", features = ["flight-sql", "tls-ring"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Memory-mapped I/O
memmap2 = "0.9"

# Object storage — pinned to the version DataFusion 55 uses, so the cold tier
# can be registered with the SQL engine rather than exposing a second,
# incompatible `ObjectStore` trait (D6).
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }

# Arrow
arrow = { version = "59" }
parquet = { version = "59", features = ["arrow"] }

# SQL engine
datafusion = "55"

# Concurrency
crossbeam-skiplist = "0.1"
crossbeam-epoch = "0.9"
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
futures = "0.3"

# File locking
fs2 = "0.4"

# Auth & crypto
argon2 = "0.5"
jsonwebtoken = "9"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono-tz = "0.10"
chrono = "0.4"

# URL encoding
percent-encoding = "2"
# Query-string parsing where a repeated key is meaningful — Prometheus's
# `?match[]=a&match[]=b`, which `serde_urlencoded` (and therefore axum's
# `Query`) cannot represent at all.
form_urlencoded = "1"

# HTTP client
# `rustls-tls-webpki-roots-no-provider` rather than `rustls-tls`: reqwest's
# `rustls-tls` is `rustls-tls-webpki-roots` plus a forced `aws-lc-rs`
# provider, so this changes the crypto provider and nothing else — the trust
# anchors are the same bundled WebPKI roots either way. It is one of the four
# edges that put a *second* rustls provider in the graph, which is the
# condition under which `ServerConfig::builder()` cannot choose and panics
# (D41).
# With ring as the only provider compiled in, rustls resolves it
# unambiguously in every crate, `chronix-security` used on its own included.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
ureq = "3"

# Authorization
cedar-policy = "4"

# Wire protocols
snap = "1"

# Embedded key-value storage (Raft log persistence)
redb = "2"

# Ingestion connectors (optional).
#
# krafka rather than rdkafka: rdkafka builds librdkafka from C via cmake, which
# is exactly the toolchain the embedded aarch64 cross-compile job does not have
# (R11). krafka is pure async Rust with `unsafe_code = "deny"`, so the `kafka`
# feature no longer costs a C toolchain or an unaudited FFI surface (D38).
krafka = { version = "0.21", default-features = false, features = ["gzip", "snappy", "lz4", "ring"] }
rumqttc = { version = "0.24" }

# Testing
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
testcontainers-modules = { version = "0.15", features = ["kafka", "mosquitto"] }

# Regex
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# ── Workspace-wide lint configuration ───────────────────────────────
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Correctness
panic = "warn"
unwrap_used = "warn"
expect_used = "allow"       # expect with a message is fine
# Re-enabling module-by-module is tracked in concepts/ROADMAP.md — the numeric
# kernels (forecast, multivariate, SIMD, codecs) index pervasively with
# structural bounds; empirically panicking sites were fixed in passes 1–25.
indexing_slicing = "allow"

# Style & clarity
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
# 25 pre-existing sites; re-enable after a dedicated style pass (concepts/ROADMAP.md).
manual_let_else = "allow"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"

# Performance
large_futures = "warn"
trivially_copy_pass_by_ref = "warn"

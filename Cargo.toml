[workspace]
resolver = "2"
members = [
    # ── Default build: the embedded database + server ──────────────
    "crates/chronix-core",
    "crates/chronix-encoding",
    "crates/chronix-engine",
    "crates/chronix-security",
    "crates/chronix-streaming",
    "crates/chronix-analytics",
    "crates/chronix-query",
    "crates/chronix",
    "crates/chronixd",
    # ── Frozen: the distributed cluster tier (build with `-p` or `--workspace`)
    "crates/chronix-meta",
    "crates/chronix-cluster",
    "crates/chronix-dsim",
    "crates/chronixd-cluster",
]

# `cargo build` / `cargo test` cover the product; `--workspace` adds the frozen tier.
default-members = [
    "crates/chronix-core",
    "crates/chronix-encoding",
    "crates/chronix-engine",
    "crates/chronix-security",
    "crates/chronix-streaming",
    "crates/chronix-analytics",
    "crates/chronix-query",
    "crates/chronix",
    "crates/chronixd",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["hupe1980"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/chronix"
documentation = "https://docs.rs/chronix"
readme = "README.md"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates. `cargo publish` needs the `version`; members inherit these with
# `chronix-core.workspace = true`.
chronix = { path = "crates/chronix", version = "0.9.0" }
chronix-core = { path = "crates/chronix-core", version = "0.9.0" }
chronix-engine = { path = "crates/chronix-engine", version = "0.9.0" }
chronix-security = { path = "crates/chronix-security", version = "0.9.0" }
chronix-streaming = { path = "crates/chronix-streaming", version = "0.9.0" }
chronix-encoding = { path = "crates/chronix-encoding", version = "0.9.0" }
chronix-query = { path = "crates/chronix-query", version = "0.9.0" }
chronix-analytics = { path = "crates/chronix-analytics", version = "0.9.0" }
# Frozen and not published, so a path-only dependency is enough.
chronix-meta = { path = "crates/chronix-meta" }
chronixd = { path = "crates/chronixd", version = "0.9.0" }
chronix-cluster = { path = "crates/chronix-cluster" }

# Optional, off by default: the `rust_decimal` interop feature on
# `chronix-core`. Nothing in the default build depends on it.
rust_decimal = { version = "1.43", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# WAL, segment metadata, catalog and model snapshots. postcard: serde-based,
# varint-encoded and maintained (bincode is archived, RUSTSEC-2025-0141). No default
# features: `heapless-cas` pulls the unmaintained `atomic-polyfill`.
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"

# Hashing & checksums
crc32c = "0.6"
fnv = "1"

# Raft consensus
openraft = { version = "0.9", features = ["serde", "storage-v2"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
async-stream = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
# No default features: chronixd serves `/metrics` itself, and the defaults pull
# `hyper-rustls`, a second crypto provider and a C build of aws-lc-sys.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# HTTP
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5" }
# `decompression-gzip`: the OpenTelemetry Collector and Telegraf gzip request
# bodies by default.
tower-http = { version = "0.7", features = [
    "cors",
    "trace",
    "limit",
    "decompression-gzip",
] }
utoipa = { version = "5", features = ["axum_extras"] }

# gRPC
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

# TLS. Library crates build client TLS configs explicitly with the platform verifier.
rustls-platform-verifier = "0.7"
# Exactly one crypto provider, aws-lc-rs: two providers with none installed make
# rustls panic. Check with `cargo tree -p chronixd -e normal -f "{p} {f}" | grep rustls`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
# Same provider as rustls above; naming it is what keeps the count at one.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
# `tls-rustls-no-provider`: provider-agnostic, so the choice stays in one place
# above rather than being made again here.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }

# Arrow Flight
arrow-flight = { version = "59", features = ["flight-sql", "tls-aws-lc"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Compression
lz4_flex = "0.14"
zstd = "0.13"

# Memory-mapped I/O
memmap2 = "0.9"

# Pinned to DataFusion's version, so the cold tier registers with the SQL engine.
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }

# Arrow. `prettyprint` for the examples, which also build without DataFusion.
arrow = { version = "59", features = ["prettyprint"] }
parquet = { version = "59", features = ["arrow"] }

# SQL engine
datafusion = "55"

# Concurrency
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
futures = "0.3"

# File locking
fs2 = "0.4"
# Who holds a data directory: a safe pid probe and the host name
rustix = { version = "1.1", default-features = false, features = ["std", "process", "system"] }

# Auth & crypto. A major argon2 bump changes the stored API-key hash format.
argon2 = "0.6"
# `aws_lc_rs`, never `rust_crypto`: the latter pulls `rsa` (RUSTSEC-2023-0071,
# a timing side channel) into JWT verification.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
zeroize = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"

# Time zones and calendars: the IANA database compiled in, never read from the host.
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }

# URL encoding
percent-encoding = "2"
# Repeated query keys (`?match[]=a&match[]=b`), which axum's `Query` cannot represent.
form_urlencoded = "1"

# HTTP client (OIDC discovery, webhooks): no provider of its own, and the platform
# CA store for verification.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# No default features: ureq's default `rustls` forces `ring` as a second provider.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

# Authorization
cedar-policy = "4"

# Wire protocols
snap = "1"

# Embedded key-value storage (Raft log persistence)
redb = "4"

# Ingestion connectors (optional). krafka is pure Rust, so the `kafka` feature
# needs no C toolchain for the aarch64 cross-compile.
krafka = { version = "0.21", default-features = false, features = ["gzip", "snappy", "lz4", "rustls-aws-lc-rs"] }
# No default features: `use-rustls` is unused here and pulls a vulnerable
# `rustls-webpki` and `ring`. MQTT is plaintext.
rumqttc = { version = "0.25", default-features = false }

# Testing
proptest = "1"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
testcontainers-modules = { version = "0.15", features = ["kafka", "mosquitto"] }

# Regex
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# ── Workspace-wide lint configuration ───────────────────────────────
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Correctness
panic = "warn"
unwrap_used = "warn"
expect_used = "allow"       # expect with a message is fine
# The numeric kernels index with structurally checked bounds.
indexing_slicing = "allow"

# Style & clarity
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "allow"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"

# Performance
large_futures = "warn"
trivially_copy_pass_by_ref = "warn"

[package]
name = "chronix"
description = "Chronix — an embedded, analytics-optimised time-series database."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["timeseries", "database", "tsdb", "embedded", "analytics"]
categories = ["database-implementations", "database", "embedded"]
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

# docs.rs builds with default features unless told otherwise, which would
# publish documentation with the feature-gated surface missing entirely — the
# cold tier, the security modules and Flight are all off by default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[features]
default = ["sql", "field-encryption"]

## SQL through DataFusion: `db.sql()`, `session_context()`, the analytics
## functions, `EXPLAIN`, and the cold tier's read half.
##
## **On by default. Turn it off to halve your build, not to shrink your
## binary** — the measurements say those are different questions:
##
## | | `default-features = false` | with `sql` |
## |---|---|---|
## | clean debug build of a small consumer | 131 s | 227 s |
## | stripped release binary, SQL unused | 11.74 MiB | 12.08 MiB |
## | stripped release binary, SQL used | — | 73.19 MiB |
## | peak heap, same aggregate | baseline | +0.86 MiB |
##
## DataFusion is ~52 MiB of object code, but the linker discards all of it
## when nothing calls it, so the *gate* is worth 0.34 MiB and cutting the
## dependency is worth 96 seconds a build. Memory is not a reason either way.
##
## Without it, writes, the native query API, PromQL, rollups, retention,
## analytics, triggers and the cold *archive* all still work — the PromQL
## evaluator never touches DataFusion.
sql = ["dep:datafusion"]

## Per-column AES-256-GCM in the `.csx` segment format, declared by
## `ChronixConfig::field_encryption` — or `[database.field_encryption]` in
## `chronixd`.
##
## **On by default.** It costs `aes-gcm` in the dependency graph and nothing
## at run time: a database that declares no column resolves no key, builds no
## provider and takes no extra branch in the block path. Without it the
## configuration is accepted and has no effect.
field-encryption = ["chronix-engine/field-encryption"]

## Change-data-capture: `Chronix::subscribe`, the event bus every write
## publishes to, and the signal/trigger engine.
##
## **Off by default.** It is ~60 packages beyond the engine — an HTTP client
## and a TLS stack among them, for webhook delivery — and an embedded
## consumer that opens a database and writes to it subscribes to nothing.
streaming = ["dep:chronix-streaming"]

## Authentication, Cedar authorization, the audit trail and the namespace
## registry.
##
## **Off by default.** It is ~125 packages beyond the engine — a JWT library,
## Argon2, `aes-gcm`, Cedar and a whole TLS stack — none of which an embedded
## `Chronix::open` touches.
##
## `chronixd` enables it unconditionally: a server without authentication,
## authorization and an audit trail is not a build anybody should be able to
## produce by accident.
security = ["dep:chronix-security"]

## The real-time pipeline: CDC → triggers → delivery, streaming anomaly
## detection and continuous forecasting, with audit and authorization wired
## through. Needs both halves above, plus webhook delivery.
pipeline = ["streaming", "security"]

## `TryFrom` conversions between `chronix::Decimal` and
## `rust_decimal::Decimal` — see `chronix-core`'s feature of the same name.
rust_decimal = ["chronix-core/rust_decimal"]

## Parquet cold tier on S3/GCS/Azure, queryable through SQL (D6).
##
## Implies `sql`: the read half registers a DataFusion listing table, so a
## cold tier without SQL could be written and never read.
object-store = ["sql", "chronix-engine/object-store", "dep:object_store", "dep:url"]

[dependencies]
chronix-core.workspace = true
chronix-encoding.workspace = true
chronix-query.workspace = true
chronix-engine.workspace = true
chronix-analytics.workspace = true
chronix-streaming = { workspace = true, optional = true }
chronix-security = { workspace = true, optional = true }
arrow.workspace = true
base64.workspace = true
dashmap.workspace = true
datafusion = { workspace = true, optional = true }
fs2.workspace = true
futures.workspace = true
async-stream.workspace = true
parking_lot.workspace = true
parquet.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
postcard.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
uuid.workspace = true
rayon.workspace = true
regex.workspace = true

# Cold tier (feature-gated)
object_store = { workspace = true, optional = true }
url = { version = "2", optional = true }
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The catalog's own framing, so a test can build a record the replay scanner
# will accept — which is what makes "a fragment with a valid record after it"
# reproducible without reaching into the engine.
crc32c.workspace = true
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "chronix_bench"
harness = false
required-features = ["sql"]

# Examples are auto-discovered from `examples/`; only the feature-gated ones
# need a declaration. They must live inside the crate: `cargo package` cannot
# include a `path = "../../examples/..."` target, so the published crate would
# declare sources it does not ship.
[[example]]
name = "cold_tier"
required-features = ["object-store"]

# Targets that exercise the SQL surface. `required-features` rather than a
# `#![cfg]` inside each file: cargo then *skips* them for a build without the
# feature, instead of compiling an empty test binary that reports success.

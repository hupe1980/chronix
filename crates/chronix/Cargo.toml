required-features = ["sql"]

[[test]]
name = "null_semantics"
required-features = ["sql"]

[[test]]
name = "sql_analytics_functions"
required-features = ["sql"]

[[test]]
name = "sql_scan_streaming"
required-features = ["sql"]

[[test]]
name = "sql_time_predicates"
required-features = ["sql"]

[[test]]
name = "sql_catalog_scope"
required-features = ["sql"]

[[test]]
name = "sql_forecast_types"
required-features = ["sql"]

[[test]]
name = "sql_projection"
required-features = ["sql"]

[[test]]

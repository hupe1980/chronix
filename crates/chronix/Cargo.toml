[package]
name = "chronix"
description = "Chronix — an embedded, analytics-optimised time-series database."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["timeseries", "database", "tsdb", "embedded", "analytics"]
categories = ["database-implementations", "database", "embedded"]
documentation.workspace = true
readme.workspace = true
# Upstream Prometheus test data: run by the test suite, not part of the product.
exclude = ["tests/promqltest/**"]

# Document every feature-gated item on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[features]
default = ["analytics", "sql", "field-encryption"]

## Forecasting, anomaly detection, declared detectors, preprocessing and the model
## registry. On by default; `sql` implies it. Turning it off removes four packages
## (`chronix-analytics`, `sha2`, `digest`, `const-oid`); `rayon` stays for the scan.
analytics = ["dep:chronix-analytics"]

## SQL through DataFusion: `db.sql()`, `session_context()`, the SQL analytics
## functions, `EXPLAIN` and the cold tier's read half. On by default. Turning it off
## cuts a small consumer's clean debug build from 227 s to 131 s; an unused SQL engine
## adds only 0.34 MiB to a stripped binary. Writes, PromQL, rollups and analytics work
## without it.
sql = ["dep:datafusion", "analytics", "dep:futures", "dep:async-stream", "dep:async-trait"]

## Per-column AES-256-GCM, declared by `ChronixConfig::field_encryption`. On by
## default; costs nothing at run time when no column is declared.
field-encryption = ["chronix-engine/field-encryption"]

## Change data capture: `Chronix::subscribe`, the event bus and the trigger engine.
## Off by default; it adds an HTTP client and a TLS stack for webhooks.
streaming = ["dep:chronix-streaming"]

## Authentication, Cedar authorization, the audit trail and namespaces. Off by
## default; `chronixd` always enables it.
security = ["dep:chronix-security"]

## The real-time pipeline: change data capture → triggers → delivery, with streaming
## anomaly detection and continuous forecasting. Implies `streaming` and `security`.
pipeline = ["streaming", "security", "dep:uuid"]

## `TryFrom` conversions between `chronix::Decimal` and `rust_decimal::Decimal`.
rust_decimal = ["chronix-core/rust_decimal"]

## Parquet cold tier on S3, GCS or Azure, queryable through SQL and readable by
## DuckDB, Polars and Spark. Implies `sql`.
object-store = ["sql", "chronix-engine/object-store", "dep:object_store", "dep:url"]

[dependencies]
chronix-core.workspace = true
chronix-encoding.workspace = true
chronix-query.workspace = true
chronix-engine.workspace = true
chronix-analytics = { workspace = true, optional = true }
chronix-streaming = { workspace = true, optional = true }
chronix-security = { workspace = true, optional = true }
arrow.workspace = true
base64.workspace = true
dashmap.workspace = true
datafusion = { workspace = true, optional = true }
fs2.workspace = true
futures = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
parking_lot.workspace = true
parquet.workspace = true
async-trait = { workspace = true, optional = true }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
postcard.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
uuid = { workspace = true, optional = true }
# Public: `Chronix::open_with_pool` takes the host's `rayon::ThreadPool`.
rayon.workspace = true
regex.workspace = true

# Cold tier (feature-gated)
object_store = { workspace = true, optional = true }
url = { version = "2", optional = true }
jiff.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The catalog's framing, so tests can build records the replay scanner accepts.
crc32c.workspace = true
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "chronix_bench"
harness = false
required-features = ["sql"]


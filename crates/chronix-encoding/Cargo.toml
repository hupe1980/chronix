[package]
name = "chronix-encoding"
description = "Column-oriented encoding and compression for the Chronix time-series database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["compression", "encoding", "timeseries", "alp", "gorilla"]
categories = ["compression", "encoding", "algorithms"]
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

# docs.rs builds with default features unless told otherwise, which would
# publish documentation with the feature-gated surface missing entirely — the
# cold tier, the security modules and Flight are all off by default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[dependencies]
chronix-core = { workspace = true }
pco = "1"
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "encoding_bench"
harness = false

[lints]
workspace = true

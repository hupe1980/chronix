[package]
name = "chronix-cluster"
description = "DataNode lifecycle, region management, and replication for Chronix clusters"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Frozen tier / dev tooling — not part of the release (D8).
publish = false

[lib]
doctest = false

[dependencies]
chronix-core.workspace = true
chronix-meta.workspace = true
chronix-analytics.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
metrics.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
postcard.workspace = true
futures.workspace = true
dashmap.workspace = true
rand.workspace = true
uuid.workspace = true
openraft.workspace = true
redb.workspace = true

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile.workspace = true
criterion = { workspace = true }

[[bench]]
name = "cluster_bench"
harness = false

[lints]
workspace = true

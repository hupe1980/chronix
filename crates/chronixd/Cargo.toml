[package]
name = "chronixd"
description = "chronixd — the Chronix time-series database server daemon."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["timeseries", "database", "server", "prometheus", "tsdb"]
categories = ["database-implementations", "command-line-utilities"]
documentation.workspace = true
readme.workspace = true

default-run = "chronixd"

# docs.rs builds with default features unless told otherwise, which would
# publish documentation with the feature-gated surface missing entirely — the
# cold tier, the security modules and Flight are all off by default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[[bin]]
name = "chronixd"
path = "src/main.rs"

[dependencies]
tonic-prost.workspace = true
prost-types.workspace = true
# Internal. The server always has authentication, authorization and the audit
# trail, so these facade features are fixed here rather than left to a flag.
chronix = { workspace = true, features = ["security", "streaming", "pipeline"] }
chronix-core.workspace = true
chronix-query.workspace = true
chronix-security.workspace = true
uuid.workspace = true
datafusion.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true
async-stream.workspace = true

# HTTP
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true

# gRPC
tonic.workspace = true
tonic-reflection.workspace = true
tonic-health.workspace = true
prost.workspace = true

# TLS
rustls.workspace = true
tokio-rustls.workspace = true
axum-server.workspace = true

# Arrow / Flight SQL
arrow.workspace = true
arrow-flight.workspace = true

# CLI
clap.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
# Binary cells reach JSON as base64; see `wire::value`.
base64.workspace = true
jiff.workspace = true
# `--demo` serves from a temporary directory it removes on exit.
tempfile.workspace = true
regex.workspace = true
postcard.workspace = true
toml.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Error handling
thiserror.workspace = true

# Misc
bytes.workspace = true
tokio-stream.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
futures.workspace = true
zeroize.workspace = true

# Wire protocols (Prometheus remote write/read snappy compression)
snap.workspace = true

# Optional OTLP trace export (feature `otlp`)
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# Optional ingestion connectors
krafka = { workspace = true, optional = true }
rumqttc = { workspace = true, optional = true }
# MCP server (`/mcp` and `chronixd mcp`): the official Rust SDK, so protocol
# revision negotiation is the SDK's job.
rmcp = { version = "3.10", default-features = false, features = ["server", "schemars", "transport-streamable-http-server", "transport-io"], optional = true }

form_urlencoded.workspace = true

# Request-body decompression (Telegraf and the OTel Collector gzip by default)
flate2 = "1"

[features]
default = ["mcp", "console"]
## The console: one static page at `/console`, compiled in. No dependency.
console = []
## The MCP server: `/mcp` over streamable HTTP and `chronixd mcp` over stdio.
mcp = ["dep:rmcp"]
## OTLP distributed-trace export (OpenTelemetry SDK + exporter).
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
## Parquet cold archive on S3/GCS/Azure, with a periodic archiving pass.
object-store = ["chronix/object-store"]
kafka = ["dep:krafka"]
mqtt = ["dep:rumqttc"]
all-connectors = ["kafka", "mqtt"]

[dev-dependencies]
# Real clients gzip their bodies; the tests that prove we accept them have to
# produce the same bytes.
flate2 = "1"
proptest.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking", "query"] }
rcgen = "0.14"
futures = "0.3"
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
criterion.workspace = true
rand.workspace = true
testcontainers-modules.workspace = true
object_store = { workspace = true }
bytes.workspace = true

[[bench]]
name = "server_throughput"
harness = false

[[test]]
name = "kafka_integration"
required-features = ["kafka"]

[[test]]
name = "mqtt_integration"
required-features = ["mqtt"]

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = { workspace = true }
prost-build = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Referenced by the code `build.rs` generates from `proto/`, not by any
# hand-written line, which is why `cargo machete` cannot see them.
ignored = ["tonic-prost", "prost-types"]

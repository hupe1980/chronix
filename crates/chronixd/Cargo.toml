[package]
name = "chronixd"
description = "chronixd — the Chronix time-series database server daemon."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["timeseries", "database", "server", "prometheus", "tsdb"]
categories = ["database-implementations", "command-line-utilities"]
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

# Not published to crates.io for v0.1.0; distributed as a binary through
# GitHub Releases instead.
#
# The reason is a manifest fact with a product cause: the `cluster`
# feature depends on `chronix-meta` and `chronix-cluster`,
# which are `publish = false` — a frozen tier and a dev tool — and cargo
# requires a version for every dependency it packages, optional ones included.
# The three options were to publish the frozen crates (inviting use of a tier
# that is explicitly not developed), to strip the two features from `chronixd`
# (76 `cfg` gates and a 547-line module, for a mode v0.1.0 cannot run anyway),
# or this. The library — which is the product — publishes normally.
#
# What would change it: splitting the cluster server integration into
# its own unpublished crate, which is what `cargo install chronixd` is waiting
# on.
publish = false
default-run = "chronixd"

# docs.rs builds with default features unless told otherwise, which would
# publish documentation with the feature-gated surface missing entirely — the
# cold tier, the security modules and Flight are all off by default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[[bin]]
name = "chronixd"
path = "src/main.rs"

[dependencies]
tonic-prost.workspace = true
prost-types.workspace = true
# Internal
chronix.workspace = true
chronix-core.workspace = true
chronix-query.workspace = true
chronix-security.workspace = true
uuid.workspace = true
chronix-meta = { workspace = true, optional = true }
chronix-cluster = { workspace = true, optional = true }
datafusion.workspace = true

# Async
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true
async-stream.workspace = true

# HTTP
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true

# gRPC
tonic.workspace = true
tonic-reflection.workspace = true
tonic-health.workspace = true
prost.workspace = true

# TLS
rustls.workspace = true
tokio-rustls.workspace = true
axum-server.workspace = true

# Arrow / Flight SQL
arrow.workspace = true
arrow-flight.workspace = true

# CLI
clap.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
postcard.workspace = true
toml.workspace = true
openraft = { workspace = true, optional = true }

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Error handling
thiserror.workspace = true

# Misc
bytes.workspace = true
tokio-stream.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
futures.workspace = true
zeroize.workspace = true

# Wire protocols (Prometheus remote write/read snappy compression)
snap.workspace = true

# Optional OTLP trace export (feature `otlp`)
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# Optional ingestion connectors
krafka = { workspace = true, optional = true }
rumqttc = { workspace = true, optional = true }

form_urlencoded.workspace = true

# Request-body decompression (Telegraf and the OTel Collector gzip by default)
flate2 = "1"

[features]
default = []
## Distributed cluster mode (Meta/Data node roles, Multi-Raft replication).
cluster = ["dep:chronix-meta", "dep:chronix-cluster", "dep:openraft"]
## Chaos fault-injection admin endpoints (dev/test only — never enable in production).
## OTLP distributed-trace export (OpenTelemetry SDK + exporter).
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
## Parquet cold archive on S3/GCS/Azure, with a periodic archiving pass.
object-store = ["chronix/object-store"]
kafka = ["dep:krafka"]
mqtt = ["dep:rumqttc"]
all-connectors = ["kafka", "mqtt"]

[dev-dependencies]
# Real clients gzip their bodies; the tests that prove we accept them have to
# produce the same bytes.
flate2 = "1"
tempfile.workspace = true
proptest.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking", "query"] }
rcgen = "0.14"
futures = "0.3"
criterion.workspace = true
rand.workspace = true
testcontainers-modules.workspace = true
object_store = { workspace = true }
bytes.workspace = true

[[bench]]
name = "server_throughput"
harness = false

[[test]]
name = "kafka_integration"
required-features = ["kafka"]

[[test]]
name = "mqtt_integration"
required-features = ["mqtt"]

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = { workspace = true }
prost-build = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Referenced by the code `build.rs` generates from `proto/`, not by any
# hand-written line, which is why `cargo machete` cannot see them.
ignored = ["prost", "tonic-prost", "prost-types"]

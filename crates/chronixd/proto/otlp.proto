// OpenTelemetry OTLP metrics types — consolidated single-package proto.
//
// Derived from the OpenTelemetry proto specification at:
// https://github.com/open-telemetry/opentelemetry-proto
// Simplified to a single package to avoid prost cross-package reference issues.

syntax = "proto3";

package otlp;

// ── Common types ───────────────────────────────────────────────────────

message AnyValue {
  oneof value {
    string string_value = 1;
    bool   bool_value   = 2;
    int64  int_value    = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes  bytes_value  = 7;
  }
}

message ArrayValue {
  repeated AnyValue values = 1;
}

message KeyValueList {
  repeated KeyValue values = 1;
}

message KeyValue {
  string   key   = 1;
  AnyValue value = 2;
}

message InstrumentationScope {
  string name    = 1;
  string version = 2;
  repeated KeyValue attributes = 3;
}

// ── Resource ───────────────────────────────────────────────────────────

message Resource {
  repeated KeyValue attributes = 1;
  uint32 dropped_attributes_count = 2;
}

// ── Metrics ────────────────────────────────────────────────────────────

message ResourceMetrics {
  Resource resource = 1;
  repeated ScopeMetrics scope_metrics = 2;
}

message ScopeMetrics {
  InstrumentationScope scope = 1;
  repeated Metric metrics = 2;
}

message Metric {
  string name        = 1;
  string description = 2;
  string unit        = 3;

  oneof data {
    Gauge                gauge                 = 5;
    Sum                  sum                   = 7;
    Histogram            histogram             = 9;
    ExponentialHistogram exponential_histogram = 10;
    Summary              summary               = 11;
  }
}

message Gauge {
  repeated NumberDataPoint data_points = 1;
}

message Sum {
  repeated NumberDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
  bool is_monotonic = 3;
}

enum AggregationTemporality {
  AGGREGATION_TEMPORALITY_UNSPECIFIED = 0;
  AGGREGATION_TEMPORALITY_DELTA = 1;
  AGGREGATION_TEMPORALITY_CUMULATIVE = 2;
}

message Histogram {
  repeated HistogramDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
}

// The base-2 exponential histogram: OTLP's native histogram.
//
// It is the same idea as Prometheus's, with one difference that matters and
// is easy to get wrong — see `ExponentialHistogramDataPoint.Buckets`.
message ExponentialHistogram {
  repeated ExponentialHistogramDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
}

message Summary {
  repeated SummaryDataPoint data_points = 1;
}

message NumberDataPoint {
  repeated KeyValue attributes = 7;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;

  oneof value {
    double as_double = 4;
    sfixed64 as_int = 6;
  }
}

message HistogramDataPoint {
  repeated KeyValue attributes = 9;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  fixed64 count = 4;
  optional double sum = 5;
  repeated fixed64 bucket_counts    = 6;
  repeated double  explicit_bounds  = 7;
}

message ExponentialHistogramDataPoint {
  repeated KeyValue attributes = 1;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  fixed64 count = 4;
  // `optional` on purpose: OTLP says a histogram that recorded negative
  // events should leave the sum unset, and without the presence bit an unset
  // sum decodes as 0.0 — a number chronix would then store as if it had been
  // measured.
  optional double sum = 5;
  // Same meaning as Prometheus's `schema`: base = 2^(2^-scale).
  sint32 scale = 6;
  fixed64 zero_count = 7;
  Buckets positive = 8;
  Buckets negative = 9;

  // A contiguous run of bucket counts starting at `offset`.
  //
  // OTLP's bucket `i` covers `(base^i, base^(i+1)]` — one lower than
  // Prometheus's. `wire::histogram` applies the shift.
  message Buckets {
    sint32 offset = 1;
    repeated uint64 bucket_counts = 2;
  }

  uint32 flags = 10;
  optional double min = 12;
  optional double max = 13;
  // Half-width of the zero region, which is the closed interval
  // [-zero_threshold, +zero_threshold].
  double zero_threshold = 14;
}

message SummaryDataPoint {
  repeated KeyValue attributes = 7;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  fixed64 count = 4;
  optional double sum = 5;
  repeated ValueAtQuantile quantile_values = 6;

  message ValueAtQuantile {
    double quantile = 1;
    double value    = 2;
  }
}

// ── Collector ──────────────────────────────────────────────────────────

message ExportMetricsServiceRequest {
  repeated ResourceMetrics resource_metrics = 1;
}

message ExportMetricsServiceResponse {
  // Deliberately empty.
}

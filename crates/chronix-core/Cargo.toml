[package]
name = "chronix-core"
description = "Core data model, types, errors, and configuration for the Chronix time-series database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["timeseries", "database", "tsdb", "metrics"]
categories = ["database-implementations", "data-structures"]
documentation.workspace = true
readme.workspace = true

# docs.rs builds with default features unless told otherwise, which would
# publish documentation with the feature-gated surface missing entirely — the
# cold tier, the security modules and Flight are all off by default.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[features]
## `TryFrom` conversions between [`Decimal`] and `rust_decimal::Decimal`. Off by
## default. Conversion into Chronix (128-bit, scale ≤ 38) always succeeds; out of it
## (96-bit, scale ≤ 28) can fail.
rust_decimal = ["dep:rust_decimal"]

[dependencies]
postcard = { workspace = true }
# For `TimeBucket`: every surface that buckets time shares it — SQL's
# `time_bucket()`, a rollup tier, and the native `downsample()` plan.
jiff = { workspace = true }
rust_decimal = { workspace = true, optional = true }
dashmap = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
fnv = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Test-only: no public item returns or accepts JSON, so consumers do not
# inherit it.
serde_json = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Test-only: the config structs are `deny_unknown_fields`, and that is only a
# guarantee if something parses a file that sets a key they do not have.
toml = { workspace = true }

[lints]
workspace = true

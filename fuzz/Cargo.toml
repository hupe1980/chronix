[package]
name = "chronix-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace, deliberately. `cargo fuzz` builds this package on
# nightly with sanitizer instrumentation and its own `RUSTFLAGS`; folding it
# into the root workspace would put `libfuzzer-sys` in `cargo build
# --workspace` and make the product build need nightly.
#
# Without this table cargo refuses outright — "current package believes it's
# in a workspace when it's not" — so every scheduled run of `fuzz.yml` failed
# before it compiled anything.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
chronix-encoding = { path = "../crates/chronix-encoding" }
chronix-engine = { path = "../crates/chronix-engine" }
tempfile = "3"

[[bin]]
name = "fuzz_column_decoder"
path = "fuzz_targets/fuzz_column_decoder.rs"
doc = false

[[bin]]
name = "fuzz_segment_reader"
path = "fuzz_targets/fuzz_segment_reader.rs"
doc = false

[[bin]]
name = "fuzz_wal_reader"
path = "fuzz_targets/fuzz_wal_reader.rs"
doc = false

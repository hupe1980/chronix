[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Each entry states why it is accepted and what would clear it. An `ignore`
# without a reason is how an advisory list stops being read.
ignore = [
  # quick-xml < 0.41 — two denial-of-service parsing bugs, pulled in only by
  # `object_store`, which pins `^0.39`. Reachable only when parsing an XML
  # response from an S3/Azure endpoint, i.e. from the object store the
  # operator configured, and only with the optional `object-store` feature
  # enabled. Clears when object_store relaxes its quick-xml requirement;
  # re-check on every object_store bump.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # chrono and chrono-tz — unmaintained, not vulnerable, and Arrow's, not ours:
  # chronix uses jiff. chrono comes with every Arrow build; chrono-tz only with
  # DataFusion (`sql`), so an embedded build has none and needs no ignore.
  # `bans` below and scripts/check-features.sh keep it that way. Clears when
  # arrow-rs moves off chrono; re-check on every Arrow bump.
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0555",
  # humantime — unmaintained, not vulnerable; object_store parses durations in
  # its own configuration with it. Re-check on every object_store bump.
  "RUSTSEC-2026-0542",
  # astral-tokio-tar — unmaintained; a dev-dependency only, through
  # testcontainers in the Kafka and MQTT integration tests. Never in a
  # published build.
  "RUSTSEC-2026-0440",
]

[licenses]
# Chronix is MIT OR Apache-2.0. Everything below is a permissive licence that
# imposes no obligation beyond attribution, grouped by why it appears.
allow = [
  # The ecosystem baseline.
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Unicode data tables (icu, unicode-ident).
  "Unicode-3.0",
  # Apache-2.0 with the LLVM linking exception — strictly more permissive than
  # plain Apache-2.0 (ar_archive_writer, and the Rust toolchain's own crates).
  "Apache-2.0 WITH LLVM-exception",
  # zlib-rs and foldhash. Permissive, attribution-only.
  "Zlib",
  # tiny-keccak. A public-domain dedication; no obligations at all.
  "CC0-1.0",
  # webpki-roots — the Mozilla CA bundle ships under the Community Data
  # Licence Agreement, which is a data licence rather than a code licence.
  "CDLA-Permissive-2.0",
  # libbz2-rs-sys. The bzip2 licence is BSD-style.
  "bzip2-1.0.6",
]
confidence-threshold = 0.8


[bans]
multiple-versions = "warn"
wildcards = "allow"
# chrono-tz is Arrow's and DataFusion's time-zone support and nobody else's.
deny = [{ crate = "chrono-tz", wrappers = ["arrow-array", "datafusion-functions"], reason = "unmaintained (RUSTSEC-2026-0555); chronix uses jiff" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
